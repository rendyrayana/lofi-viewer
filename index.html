<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lofi-viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/components.css" />
</head>
<body>
  <div id="app">
    <header id="topbar"></header>
    <div id="main">
      <div id="viewport">
        <button id="viewer-exit" aria-label="Exit viewer mode" title="Exit viewer">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M2 2l10 10M12 2L2 12"/>
          </svg>
        </button>
        <canvas id="canvas"></canvas>
        <div id="hud" aria-live="polite" aria-label="Scene stats">
          <span>SCENE<span id="hud-scene">  —</span></span>
          <span>TRIS <span id="hud-tris">  0</span></span>
          <span>RES  <span id="hud-res">  —</span></span>
          <span>FPS  <span id="hud-fps">  0</span></span>
        </div>
        <div id="cam-toolbar" role="toolbar" aria-label="Camera controls"></div>
      </div>
      <aside id="sidebar">
        <nav id="tab-strip" role="tablist" aria-label="Panels"></nav>
        <div id="panel-content"></div>
      </aside>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
